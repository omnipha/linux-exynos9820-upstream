; Galaxy S10 speaker path: the two CS35L41 digital volumes follow the Pulse volume.
; Analog gain is fixed at maximum by mb007-audio-route.
[General]
priority = 100
description-key = analog-output-speaker

[Properties]
device.icon_name = audio-speakers

; These are independent mono amplifiers on different hardware stereo slots.
; Without explicit channel masks PulseAudio treats them as serial stages.
[Element Bottom Digital PCM]
volume = merge
override-map.1 = front-right

[Element Receiver Digital PCM]
volume = merge
override-map.1 = front-left
