title Safe Mode (console and USB SSH)
sort-key ab-safemode
linux vmlinuz
initrd initramfs
devicetree dtbs/exynos/exynos9820-beyond2lte.dtb
options console=tty0 loglevel=7 pmos_boot_uuid=<BOOT_UUID> pmos_root_uuid=<ROOT_UUID> pmos_rootfsopts=defaults mb007.usb=1 mb007.muic=1 systemd.unit=multi-user.target
